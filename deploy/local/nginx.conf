# LOCAL ONLY. Compose runs Nginx with prefix /work/.
# 8443 is mapped to canonical port 443 by curl --connect-to; browser testing needs
# an owner-approved loopback port mapping. Never browse canonical-host:8443.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;
events { worker_connections 128; }
http {
 access_log off;
 client_body_temp_path /tmp/body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 1m;
 client_header_timeout 10s;
 client_body_timeout 5s;
 keepalive_timeout 60s;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_certificate runtime/tls.crt;
 ssl_certificate_key runtime/tls.key;
 server {
  listen 8443 ssl default_server;
  server_name _;
  return 421;
 }
 server {
  listen 8443 ssl;
  server_name connect.wizpay.xyz;
  if ($http_host != "connect.wizpay.xyz") { return 421; }
  if ($http_forwarded != "") { return 400; }
  if ($http_x_forwarded_host != "") { return 400; }
  if ($http_x_forwarded_proto != "") { return 400; }
  if ($http_x_forwarded_for != "") { return 400; }
  include proxy-common.conf;
  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  location = /onboarding { proxy_pass http://frontend:3000; }
  location ^~ /_next/ { proxy_pass http://frontend:3000; }
  location ^~ /browser/ { client_max_body_size 1k; proxy_pass http://go:8080; }
  location ^~ /oauth/ { client_max_body_size 8k; proxy_pass http://go:8080; }
  location = /.well-known/oauth-authorization-server { proxy_pass http://go:8080; }
  location / { return 404; }
 }
 server {
  listen 8443 ssl;
  server_name mcp.wizpay.xyz;
  if ($http_host != "mcp.wizpay.xyz") { return 421; }
  if ($http_forwarded != "") { return 400; }
  if ($http_x_forwarded_host != "") { return 400; }
  if ($http_x_forwarded_proto != "") { return 400; }
  if ($http_x_forwarded_for != "") { return 400; }
  include proxy-common.conf;
  add_header Cache-Control "no-store" always;
  location = /mcp { proxy_pass http://go:8080; }
  location = /.well-known/oauth-protected-resource { proxy_pass http://go:8080; }
  location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://go:8080; }
  location / { return 404; }
 }
}
