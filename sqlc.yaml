version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbsqlc
        out: internal/storage/postgres/dbsqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
